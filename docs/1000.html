        right: 0;
        top: 0;

        padding: 16px;

        .error-col {
          margin-left: 0;
          width: 100%;
        }
      }
      .arrow-wrapper {
        position: absolute;
        left: 10%;
        width: 700px;
        height: 700px;
        top: -150px;
        z-index: -1;
      }
      @media (max-width: 1000px) {
        .arrow-wrapper {
          transform: rotate(1000deg) scale(-1, -1);
          top: -50px;
          right: -20px;
          left: unset;

          height: 400px;
        }
      }
      .arrow-wrapper svg {
        width: 100%;
        height: 100%;
      }
      p {

        line-height: 24px;
      }

        background-color: #434346;
        padding: 45px;
