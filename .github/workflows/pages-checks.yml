name: Pages checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Contract, HTML validity and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: docs/ is generated from src/ and up to date
        run: npm run build -- --check

      - name: Cloudflare contract and boilerplate parity
        run: npm run check:pages

      - name: HTML validity
        run: npm run lint:html

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core, WCAG 2.2 AA, desktop and mobile)
        run: npm run test:a11y
