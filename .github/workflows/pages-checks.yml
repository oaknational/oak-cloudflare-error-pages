name: Pages checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Contract, HTML validity and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cloudflare contract and boilerplate parity
        run: npm run check:pages

      - name: HTML validity
        run: npm run lint:html

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core, WCAG 2.2 AA, desktop and mobile)
        run: npm run test:a11y
