name: Pages smoke test

# After a push to main, GitHub Pages rebuilds docs/ asynchronously. This waits
# until every page on the live origin matches the committed file, so a broken
# publish is caught before Cloudflare next fetches the pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live pages match main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Wait for GitHub Pages to serve the committed pages
        run: node scripts/smoke-pages.mjs
