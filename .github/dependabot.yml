version: 2
updates:

  # Track updates for every action used in .github/workflows. Actions are pinned
  # to commit SHAs, and Dependabot updates the SHA and the version comment
  # together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Track updates for the npm dev tooling (html-validate, axe-core, Playwright).
  # These only run the checks - the published pages in docs/ are static HTML
  # with no runtime dependencies - so updates are grouped into a single weekly
  # PR to keep noise down. Without this entry Dependabot security PRs for npm
  # cannot be rebased or recreated.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dev-tooling:
        patterns: ["*"]
